<!-- Universal Sidebar (skeleton) -->
<aside class="universal-sidebar" aria-label="Universal sidebar">
  <div class="sidebar-header">
    <button class="sidebar-close-btn" aria-label="Close sidebar" title="Close">✕</button>
  </div>
  <div class="sidebar-content">
    <div class="sidebar-top" id="sidebar-top"></div>
    <div class="sidebar-bottom" id="sidebar-bottom">
      <h3 class="text-xs uppercase mb-3 sidebar-muted-text">Recent Companies</h3>
      <div id="sidebar-recent-companies"></div>
      <div class="sidebar-section-border" style="margin:12px 0"></div>
      <button id="universal-sidebar-theme-toggle" class="nav-link w-full px-4 py-2 rounded-lg transition flex items-center gap-3" aria-label="Toggle theme">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
        <span>Theme</span>
      </button>
    </div>
  </div>
</aside>
