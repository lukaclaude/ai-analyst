<!-- Universal Header Component -->
<!-- Include this file in any page that needs the universal header -->
<!-- Usage: <div id="universal-header-container"></div> then load this component -->

<header class="universal-header" id="universal-header">
    <div class="universal-header-content">
        <!-- Left Section -->
        <div class="header-left">
            <a href="/" class="logo-container" aria-label="Finalysis Home">
                <img class="logo" src="/assets/favicons/favicon.svg" alt="Finalysis" width="32" height="32"/>
                <span class="logo-text logo-mono"><./AI/ANALYST></span>
            </a>

            <!-- Dynamic company chip (visible on company page when hero scrolled away) -->
            <div class="company-chip" id="uh-company-chip" hidden>
                <img id="uh-chip-logo" alt="Logo" />
                <div class="chip-texts">
                    <div class="chip-line1"><span id="uh-chip-ticker">TICKER</span><span id="uh-chip-score"></span></div>
                    <div class="chip-line2"><span id="uh-chip-price">$0.00</span><span id="uh-chip-currency"></span></div>
                </div>
            </div>
            
            <!-- Global Search -->
            <div class="global-search-container">
                <svg class="search-icon" width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                </svg>
                <input type="text" class="global-search" placeholder="Search companies..." id="global-search">
                <div class="search-results-dropdown" id="global-search-results"></div>
            </div>
        </div>
        
        <!-- Right Section -->
        <div class="header-right">
            <!-- Markets Dropdown -->
            <button class="header-button" id="markets-button">
                <span>Markets</span>
                <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </button>
            
            <!-- Watchlist -->
            <button class="header-button" id="watchlist-button">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
                <span>Watchlist</span>
            </button>
            
            <!-- Theme Toggle -->
            <button class="header-button icon-only" id="universal-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                <svg class="sun-icon" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                </svg>
                <svg class="moon-icon" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                </svg>
            </button>
            
            <!-- User Avatar -->
            <button class="user-avatar" id="user-menu-button">
                <div class="avatar-placeholder">U</div>
            </button>
        </div>
    </div>
</header>

<style>
/* Universal Header Styles */
.universal-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 45px;
    background: linear-gradient(
        135deg,
        var(--glass-gradient-start, rgba(255, 255, 255, 0.08)) 0%,
        var(--glass-gradient-end, rgba(255, 255, 255, 0.02)) 100%
    );
    backdrop-filter: var(--glass-blur, blur(20px)) var(--glass-saturate, saturate(180%));
    -webkit-backdrop-filter: var(--glass-blur, blur(20px)) var(--glass-saturate, saturate(180%));
    border-bottom: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
    box-shadow: var(--shadow-sm, 0 1px 2px 0 rgba(0, 0, 0, 0.5));
    z-index: 1000;
    transition: all 0.3s ease;
}

.universal-header-content {
    height: 100%;
    max-width: 1920px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header-left,
.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* Logo */
.logo-container {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--color-text-primary, #E6EDF3);
    transition: all 0.2s ease;
}

.logo-container:hover {
    transform: scale(1.05);
}

.logo {
    color: var(--color-accent-purple, #a855f7);
}

.logo-text {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.5px;
}
.logo-mono { font-family: var(--font-mono, 'JetBrains Mono', monospace); font-weight: 700; letter-spacing: 0; }

/* Global Search */
.global-search-container {
    position: relative;
    width: 300px;
}

.global-search {
    width: 100%;
    height: 32px;
    padding: 0 12px 0 36px;
    background: var(--glass-bg, rgba(255, 255, 255, 0.05));
    border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
    border-radius: 6px;
    color: var(--color-text-primary, #E6EDF3);
    font-size: 14px;
    transition: all 0.2s ease;
}

.global-search:focus {
    outline: none;
    background: var(--glass-bg-hover, rgba(255, 255, 255, 0.08));
    border-color: var(--color-accent-purple, #a855f7);
    width: 350px;
}

.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-muted, #7d8590);
    pointer-events: none;
}

.search-results-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: rgba(22, 27, 34, 0.98);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    display: none;
    z-index: 1501; /* above header */
}

.search-results-dropdown.active {
    display: block;
}

/* Header search results styled similar to sidebar */
.search-results-list {
    display: flex;
    flex-direction: column;
    padding: 6px;
}

.search-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--color-text-primary);
    transition: background var(--transition-fast);
}

.search-result-item:hover {
    background: var(--glass-bg-hover);
}

.search-result-item .search-result-main {
    display: flex;
    flex-direction: column;
}

.search-result-item .search-result-ticker {
    font-weight: 700;
    font-size: 0.9rem;
}

.search-result-item .search-result-name {
    font-size: 0.75rem;
    color: var(--color-text-secondary);
}

.search-result-item .search-result-score {
    font-size: 0.8rem;
    color: var(--color-text-secondary);
}

/* Header Buttons */
.header-button {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--color-text-muted, #7d8590);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.header-button:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--color-text-primary, #E6EDF3);
}

/* Company chip styling */
.company-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: 12px;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid var(--glass-border, rgba(255,255,255,0.12));
    background: linear-gradient(135deg, var(--glass-gradient-start, rgba(255,255,255,0.08)) 0%, var(--glass-gradient-end, rgba(255,255,255,0.02)) 100%);
    backdrop-filter: var(--glass-blur, blur(10px)) var(--glass-saturate, saturate(160%));
}
.company-chip img { width: 18px; height: 18px; border-radius: 4px; background: transparent; object-fit: contain; }
.company-chip .chip-texts { display: flex; flex-direction: column; line-height: 1; }
.company-chip .chip-line1 { display: flex; align-items: center; gap: 6px; }
.company-chip .chip-line2 { font-size: 11px; opacity: 0.9; }
.company-chip #uh-chip-ticker { font-weight: 700; font-size: 12px; letter-spacing: 0.2px; }
.company-chip #uh-chip-score { font-size: 11px; color: var(--color-text-secondary, #C9D1D9); }
.company-chip #uh-chip-price { font-weight: 600; }
.company-chip #uh-chip-currency { margin-left: 4px; opacity: 0.8; font-size: 11px; }

@media (max-width: 768px) {
  .company-chip { display: none; }
}

/* Align chip after expanded sidebar on company pages (desktop) */
@media (min-width: 1024px) {
  body[data-page-context="company-card"].sidebar-expanded .company-chip { margin-left: 240px; }
}

.header-button.icon-only {
    padding: 8px;
}

/* Theme Toggle - Default (dark theme) */
#universal-theme-toggle .moon-icon {
    display: none;
}

#universal-theme-toggle .sun-icon {
    display: block;
}

/* User Avatar */
.user-avatar {
    width: 32px;
    height: 32px;
    padding: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
}

.user-avatar:hover {
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.4);
}

.avatar-placeholder {
    color: white;
    font-weight: 600;
    font-size: 14px;
}

/* Light theme adjustments */
.light-theme .header-button {
    color: #57606a;
    background: transparent;
    border: none;
}

.light-theme .header-button:hover {
    background: rgba(0, 0, 0, 0.05);
    color: #0d1117;
}

/* Light theme search adjustments */
.light-theme .global-search {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #d0d7de;
    color: #0d1117;
}

.light-theme .global-search::placeholder {
    color: #656d76;
}

.light-theme .global-search:focus {
    background: #ffffff;
    border-color: #0969da;
}

.light-theme .search-results-dropdown {
    background: #ffffff;
    border: 1px solid #d0d7de;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
}

/* Theme toggle specific */
.light-theme #universal-theme-toggle .sun-icon {
    display: none;
}

.light-theme #universal-theme-toggle .moon-icon {
    display: block;
}

/* Responsive */
@media (max-width: 768px) {
    .global-search-container {
        display: none;
    }
    
    .header-button span {
        display: none;
    }
    
    .logo-text {
        display: none;
    }
}

/* Mobile: on-demand search reveal via body class */
@media (max-width: 768px) {
    body.show-mobile-search .global-search-container {
        display: block;
        position: fixed;
        top: 50px; /* below header */
        left: 12px;
        right: 12px;
        width: auto;
        z-index: 1100;
    }
    body.show-mobile-search .universal-header { z-index: 1101; }
    body.show-mobile-search .global-search {
        background: var(--color-bg-secondary) !important;
        border: 1px solid var(--color-border-primary) !important;
        color: var(--color-text-primary) !important;
        box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    body.show-mobile-search .global-search::placeholder {
        color: var(--color-text-muted);
    }
}
</style>
