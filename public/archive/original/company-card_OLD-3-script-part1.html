            return `0 ${yOffset}px ${blur}px ${spread}px ${glowColor}, 0 10px 20px rgba(0,0,0,0.2)`;

        // Helper function to format currency
        function formatCurrency(value, forceDecimals = 2, currencyCode = 'USD') {
            if (value === null || value === undefined || isNaN(parseFloat(value))) return 'N/A';
            
            const currencySymbols = {
                USD: '$', EUR: '€', TWD: 'NT$', CNY: '¥', JPY: '¥', 
                DKK: 'kr', CAD: 'C$', KRW: '₩', GBP: '£', CHF: 'CHF'
            };
            
            const symbol = currencySymbols[currencyCode.toUpperCase()] || currencyCode + ' ';

            const num = parseFloat(value);
            const absNum = Math.abs(num);
            
            let formattedNum;
            if (absNum >= 1e12) formattedNum = `${(num / 1e12).toFixed(forceDecimals)}T`;
            else if (absNum >= 1e9) formattedNum = `${(num / 1e9).toFixed(forceDecimals)}B`;
            else if (absNum >= 1e6) formattedNum = `${(num / 1e6).toFixed(forceDecimals)}M`;
            else if (absNum >= 1e3) formattedNum = `${(num / 1e3).toFixed(forceDecimals)}K`;
            else formattedNum = num.toFixed(forceDecimals);
            
            // For currencies like USD, EUR, GBP, put symbol first. For others, put it after.
            if (['USD', 'EUR', 'GBP', 'CAD', 'CHF'].includes(currencyCode.toUpperCase())) {
                return `${symbol}${formattedNum}`;
            }
            return `${formattedNum} ${symbol}`;
        }

        // --- REPLACE the old function with this NEW version ---
        async function fetchAndDrawPriceChart(ticker, timeframe = '1M') {
            currentChartTimeframe = timeframe;
        const functionUrl = 'https://getchartdata-py46mxz5aq-uc.a.run.app';
        const canvas = document.getElementById('mini-price-chart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
    
        // --- THEME-AWARE COLOR DEFINITIONS ---
        const isLightTheme = document.body.classList.contains('light-theme');
        const upColor = isLightTheme ? 'rgba(22, 163, 74, 0.8)' : 'rgba(34, 197, 94, 0.8)';
        const downColor = isLightTheme ? 'rgba(220, 53, 69, 0.8)' : 'rgba(239, 68, 68, 0.8)';
        const upGradient = isLightTheme ? 'rgba(22, 163, 74, 0.2)' : 'rgba(34, 197, 94, 0.3)';
        const downGradient = isLightTheme ? 'rgba(220, 53, 69, 0.2)' : 'rgba(239, 68, 68, 0.3)';
        const labelColor = isLightTheme ? '#535a5f' : '#C9D1D9';
        const gradientEndColor = isLightTheme ? 'rgba(248, 249, 250, 0)' : 'rgba(13, 17, 23, 0)';
        const errorColor = isLightTheme ? '#dc3545' : '#ef4444';
    
        document.querySelectorAll('#chart-timeframe-buttons button').forEach(btn => {
            btn.classList.remove('active-chart-button');
            if (btn.textContent === timeframe) btn.classList.add('active-chart-button');
        });
    
        try {
            const response = await fetch(`${functionUrl}?ticker=${ticker}&timeframe=${timeframe}`);
            if (!response.ok) throw new Error(`Function returned status ${response.status}`);
            
            const result = await response.json();
            const data = result.data;
    
            if (!data || data.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = labelColor;
                ctx.textAlign = 'center';
                ctx.fillText('No chart data available.', canvas.width / 2, canvas.height / 2);
                return;
            }
    
            const historicalData = data.reverse();
            const prices = historicalData.map(d => d.close);
            const isUp = prices[prices.length - 1] >= prices[0];
            const maxPrice = Math.max(...prices);
            const minPrice = Math.min(...prices);
            const midPrice = minPrice + (maxPrice - minPrice) / 2;
            const range = maxPrice - minPrice === 0 ? 1 : maxPrice - minPrice;
    
            const width = canvas.width = canvas.parentElement.offsetWidth;
            const height = canvas.height = canvas.parentElement.offsetHeight;
    
            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            ctx.moveTo(0, height - ((prices[0] - minPrice) / range) * height);
            prices.forEach((price, index) => {
                const x = (index / (prices.length - 1)) * width;
                const y = height - ((price - minPrice) / range) * height;
                ctx.lineTo(x, y);
            });
    
            ctx.strokeStyle = isUp ? upColor : downColor;
            ctx.lineWidth = 2;
            ctx.stroke();
    
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, isUp ? upGradient : downGradient);
            gradient.addColorStop(1, gradientEndColor);
            ctx.fillStyle = gradient;
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();
    
            ctx.fillStyle = labelColor;
            ctx.font = '10px Inter';
            ctx.textAlign = 'right';
            ctx.fillText(maxPrice.toFixed(2), width - 5, 10);
            ctx.fillText(midPrice.toFixed(2), width - 5, height / 2 + 5);
            ctx.fillText(minPrice.toFixed(2), width - 5, height - 25);
    
            const formatDate = (dateStr) => {
                const date = new Date(dateStr);
                if (timeframe === '1D') return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };
            const startDate = formatDate(historicalData[0].date);
            const midDate = formatDate(historicalData[Math.floor(historicalData.length / 2)].date);
            const endDate = formatDate(historicalData[historicalData.length - 1].date);
    
            ctx.textAlign = 'left';
            ctx.fillText(startDate, 5, height - 5);
            ctx.textAlign = 'center';
            ctx.fillText(midDate, width / 2, height - 5);
            ctx.textAlign = 'right';
            ctx.fillText(endDate, width - 40, height - 5);
    
        } catch (error) {
            console.error('Error calling getChartData HTTP function:', error);
             ctx.clearRect(0, 0, canvas.width, canvas.height);
             ctx.fillStyle = errorColor;
             ctx.textAlign = 'center';
             ctx.fillText('Failed to load chart.', canvas.width / 2, canvas.height / 2);
        }
    }

        // Helper function to format metric names
        function formatMetricName(metric) {
            return metric
                .replace(/([A-Z])/g, ' $1')
                .trim()
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
                .join(' ');
        }

        // New function to format market cap with currency and magnitude
        function formatMarketCap(value, currencyCode) {
            if (!value || isNaN(value)) return 'N/A';

            let symbol = '';
            switch (currencyCode.toUpperCase()) {
                case 'USD': symbol = '$'; break;
                case 'EUR': symbol = '€'; break;
                case 'GBP': symbol = '£'; break;
                case 'DKK': symbol = 'kr.'; break;
                default: symbol = currencyCode + ' '; break;
            }

            let displayValue;
            if (value >= 1e12) {
                displayValue = `${(value / 1e12).toFixed(1)} tn`;
            } else if (value >= 1e9) {
                displayValue = `${(value / 1e9).toFixed(1)} bn`;
            } else if (value >= 1e6) {
                displayValue = `${(value / 1e6).toFixed(1)} m`;
            } else if (value >= 1e3) {
                displayValue = `${(value / 1e3).toFixed(1)} k`;
            } else {
                displayValue = value.toFixed(2);
            }
            
            return `${symbol}${displayValue}`;
        }

        // Search functionality
        let searchableStocks = [];
        
        async function loadSearchableStocks() {
            try {
                const querySnapshot = await db.collection("stocks").get();
                searchableStocks = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.Portfolio?.ticker && data.Portfolio?.companyName) {

        function setupSearchBar() {
            // Handle click on search icon when sidebar is collapsed
            const searchContainer = document.querySelector('.nav-item-search');
            if (searchContainer) {
                searchContainer.addEventListener('click', (e) => {
                    const sidebar = document.querySelector('.sidebar');
                    const isCollapsed = sidebar.classList.contains('sidebar-collapsed') || 
                                       !sidebar.classList.contains('sidebar-expanded');
                    
                    if (isCollapsed && !e.target.matches('input')) {
                        e.preventDefault();
                        expandSidebarForSearch();
                    }
                });
            }
            const searchInput = document.getElementById('sidebar-search');
            const searchResults = document.getElementById('search-results');
            
            if (!searchInput || !searchResults) return;
            
            let searchTimeout;
            
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.toLowerCase().trim();
                
                if (query.length < 2) {
                    searchResults.classList.add('hidden');
                    searchResults.innerHTML = '';
                    return;
                }
                
                searchTimeout = setTimeout(() => {
                    const matches = searchableStocks.filter(stock => 
                        stock.ticker.toLowerCase().includes(query) || 
                        stock.name.toLowerCase().includes(query)
                    ).slice(0, 10); // Limit to 10 results
                    
                    if (matches.length === 0) {
                        searchResults.innerHTML = '<div class="p-3 text-sm text-gray-400 text-center">No stocks found</div>';
                    } else {
                        searchResults.innerHTML = matches.map(stock => `
                            <div class="search-result-item" data-ticker="${stock.ticker}">
                                <div class="search-result-ticker">${stock.ticker}</div>
                                <div class="search-result-name">${stock.name}</div>
                            </div>
                        `).join('');
                    }
                    
                    searchResults.classList.remove('hidden');
                }, 300);
            });
            
            // Handle result clicks
            searchResults.addEventListener('click', (e) => {
                const resultItem = e.target.closest('.search-result-item');
                if (resultItem) {
                    const ticker = resultItem.dataset.ticker;
                    window.location.href = `company-card.html?ticker=${ticker}`;
                }
            });
            
            // Hide results when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.sidebar-search-container')) {
                    searchResults.classList.add('hidden');
                }
            });
            
            // Handle escape key
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchResults.classList.add('hidden');
                    searchInput.blur();
                }
            });
        }

        // FIX 2: Added function to calculate company tier
        function calculateCompanyTier() {
            const qualityScore = parseFloat(currentStockData.Portfolio.qualityScore);
            const idqScore = parseFloat(currentStockData.LLM_Reports?.IDQ_Report?.idqScore || 0);
            const antiFragileScore = parseFloat(currentStockData.Anti_Fragile_Score.totalScore);
            
            // Normalize scores to 0-100 scale
            const qualityNorm = (qualityScore / 109) * 100;
            const idqNorm = ((idqScore + 3) / 15) * 100; // IDQ range is -3 to 12
            const antiFragileNorm = ((antiFragileScore + 7) / 24) * 100; // Anti-Fragile range is -7 to 17
            
            // Weighted average: Quality 40%, IDQ 35%, Anti-Fragile 25%
            const overallScore = (qualityNorm * 0.4) + (idqNorm * 0.35) + (antiFragileNorm * 0.25);
            
            let tier = {};
            if (overallScore >= 85) {
                tier = { name: 'Apex Performer', color: 'var(--color-purple)', class: 'text-purple-500', description: 'Elite companies with exceptional fundamentals, pioneering innovation, and fortress-like resilience' };
            } else if (overallScore >= 78) {
                tier = { name: 'Industry Powerhouse', color: 'var(--color-blue)', class: 'text-blue-500', description: 'Strong companies leading their industries with robust competitive advantages' };
            } else if (overallScore >= 65) {
                tier = { name: 'Quality Compounder', color: 'var(--color-green)', class: 'text-green-500', description: 'Solid companies with good fundamentals and steady growth potential' };
            } else if (overallScore >= 55) {
                tier = { name: 'Mixed Signals', color: 'var(--color-yellow)', class: 'text-yellow-500', description: 'Companies with mixed signals showing both promise and challenges' };
            } else if (overallScore >= 32) {
                tier = { name: 'Positionally challenged', color: 'var(--color-orange)', class: 'text-orange-500', description: 'Challenged companies that may offer turnaround potential (and risk)' };
            } else {
                tier = { name: 'High Risk', color: 'var(--color-red)', class: 'text-red-500', description: 'Companies facing significant operational or financial headwinds' };
            }
            
            tier.score = overallScore;
            window.companyTier = tier; // Store globally if needed elsewhere
            return tier;
        }

        // Calculate percentile rankings for scores
        async function calculateScoreRankings() {
            try {
                // Fetch all stocks to calculate rankings
                const querySnapshot = await db.collection("stocks").get();
                const allScores = {
                    quality: [],
                    idq: [],
                    antiFragile: []
                };
                
                // Collect all scores with their values
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.Portfolio?.qualityScore) {
                        allScores.quality.push(parseFloat(data.Portfolio.qualityScore));
                    }
                    if (data.LLM_Reports?.IDQ_Report?.idqScore) {
                        allScores.idq.push(parseFloat(data.LLM_Reports.IDQ_Report.idqScore));
                    }
                    if (data.Anti_Fragile_Score?.totalScore) {
                        allScores.antiFragile.push(parseFloat(data.Anti_Fragile_Score.totalScore));
                    }
                });
                
                // Sort arrays in descending order (highest first)
                allScores.quality.sort((a, b) => b - a);
                allScores.idq.sort((a, b) => b - a);
                allScores.antiFragile.sort((a, b) => b - a);
                
                // Calculate current stock's position
                if (currentStockData) {
                    const qualityScore = parseFloat(currentStockData.Portfolio.qualityScore);
                    const idqScore = parseFloat(currentStockData.LLM_Reports?.IDQ_Report?.idqScore || 0);
                    const antiFragileScore = parseFloat(currentStockData.Anti_Fragile_Score.totalScore);
                    
                    // Find position (1-based)
                    const qualityRank = allScores.quality.findIndex(s => s <= qualityScore) + 1;
                    const idqRank = allScores.idq.findIndex(s => s <= idqScore) + 1;
                    const antiFragileRank = allScores.antiFragile.findIndex(s => s <= antiFragileScore) + 1;
                    
                    // Update the UI
                    const qualityRankEl = document.getElementById('quality-rank');
                    const idqRankEl = document.getElementById('idq-rank-placeholder');
                    const antiFragileRankEl = document.getElementById('antifragile-rank-placeholder');
                    
                    if (qualityRankEl) {
                        qualityRankEl.textContent = `#${qualityRank} of ${allScores.quality.length}`;
                        qualityRankEl.setAttribute('data-tooltip', `This company ranks ${qualityRank} out of ${allScores.quality.length} companies in Enterprise Quality`);
                    }
                    if (idqRankEl) {
                        idqRankEl.textContent = `#${idqRank} of ${allScores.idq.length}`;
                        idqRankEl.setAttribute('data-tooltip', `This company ranks ${idqRank} out of ${allScores.idq.length} companies in Innovation & Disruption Quotient`);
                    }
                    if (antiFragileRankEl) {
                        antiFragileRankEl.textContent = `#${antiFragileRank} of ${allScores.antiFragile.length}`;
                        antiFragileRankEl.setAttribute('data-tooltip', `This company ranks ${antiFragileRank} out of ${allScores.antiFragile.length} companies in Anti-Fragile Score`);
                    }
                }
            } catch (error) {
                console.error('Error calculating score rankings:', error);
            }
        }
        
        // Helper function to calculate percentile
        function getPercentile(value, sortedArray) {
            if (sortedArray.length === 0) return 50;
            
            let count = 0;
            for (let i = 0; i < sortedArray.length; i++) {
                if (sortedArray[i] < value) {
                    count++;
                } else {
                    break;
                }
            }
            
            return Math.round((count / sortedArray.length) * 100);
        }
