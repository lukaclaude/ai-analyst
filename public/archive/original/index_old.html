                const qualityClass = getScoreColor(qualityPercentage).class.replace('text-', 'score-');
                
                const idqPercentage = ((idqScore + 3) / 15) * 100;
                const idqClass = getScoreColor(idqPercentage).class.replace('text-', 'score-');
                
                const antiFragilePercentage = ((antiFragileScore + 7) / 24) * 100;
                const antiFragileClass = getScoreColor(antiFragilePercentage).class.replace('text-', 'score-');
                
                const tierClass = tier.class.replace('text-', 'score-');
                
                const calculateYoY = (ttmValue, y1Value) => {
                    if (!ttmValue || !y1Value) return { value: 'N/A', class: '' };
                    const ttmNum = parseFloat(String(ttmValue).replace(/,/g, ''));
                    const y1Num = parseFloat(String(y1Value).replace(/,/g, ''));
                    if (y1Num === 0) return { value: 'N/A', class: '' };
                    const change = ((ttmNum - y1Num) / Math.abs(y1Num)) * 100;
                    return {
                        value: `${change >= 0 ? '+' : ''}${change.toFixed(1)}%`,
                        class: change >= 0 ? 'score-green' : 'score-red'
                    };
                };
                
                const revYoY = calculateYoY(ttm?.Income_Statement?.revenue, y1?.Income_Statement?.revenue);
                const niYoY = calculateYoY(ttm?.Income_Statement?.netIncome, y1?.Income_Statement?.netIncome);
                const fcfYoY = calculateYoY(ttm?.Cash_Flow?.freeCashflow, y1?.Cash_Flow?.freeCashflow);
                
                const formatValue = (value, suffix = '') => {
                    if (value === null || value === undefined) return 'N/A';
                    const num = parseFloat(String(value).replace(/,/g, ''));
                    if (isNaN(num)) return 'N/A';
                    const absNum = Math.abs(num);
                    const sign = num < 0 ? '-' : '';
                    let formatted;
                    if (absNum >= 1e12) formatted = `${sign}${(absNum / 1e12).toFixed(1)}T`;
                    else if (absNum >= 1e9) formatted = `${sign}${(absNum / 1e9).toFixed(1)}B`;
                    else if (absNum >= 1e6) formatted = `${sign}${(absNum / 1e6).toFixed(1)}M`;
                    else if (absNum >= 1e3) formatted = `${sign}${(absNum / 1e3).toFixed(1)}K`;
                    else formatted = `${sign}${absNum.toFixed(1)}`;
                    return formatted + suffix;
                };
                
                const lastUpdateString = stock.LLM_Research_and_Comments?.Summaries_Group?.lastUpdate || '';
                const formattedDate = lastUpdateString ? lastUpdateString.split(' - ')[0].split('\n')[0].trim() : 'N/A';
                
                tableHtml += `
                    <tr class="cursor-pointer" onclick="window.location.href='company-card.html?ticker=${p.ticker}&view=table'">
                        <td class="ticker-cell font-bold">${p.ticker}</td>
                        <td class="truncate" style="max-width: 200px;" title="${p.companyName}">${p.companyName}</td>
                        <td class="text-gray-400">${formattedDate}</td>
                        <td class="score-cell ${tierClass} font-bold">${tier.score.toFixed(1)}</td>
                        <td class="${tierClass} font-semibold">${tier.name}</td>
                        <td class="score-cell ${qualityClass} font-bold">${qualityScore.toFixed(1)}</td>
                        <td class="score-cell ${idqClass} font-bold">${idqScore.toFixed(0)}</td>
                        <td class="score-cell ${antiFragileClass} font-bold">${antiFragileScore.toFixed(0)}</td>
                        <td class="score-cell">${formatValue(healthScores.marketCap)}</td>
                        <td class="score-cell">${ratios.priceEarningsRatio ? parseFloat(ratios.priceEarningsRatio).toFixed(2) : 'N/A'}</td>
                        <td class="score-cell">${formatValue(ttm?.Income_Statement?.revenue)}</td>
                        <td class="score-cell ${revYoY.class}">${revYoY.value}</td>
                        <td class="score-cell ${parseFloat(ttm?.Income_Statement?.netIncome) < 0 ? 'score-red' : ''}">${formatValue(ttm?.Income_Statement?.netIncome)}</td>
                        <td class="score-cell ${niYoY.class}">${niYoY.value}</td>
                        <td class="score-cell ${parseFloat(ttm?.Cash_Flow?.freeCashflow) < 0 ? 'score-red' : ''}">${formatValue(ttm?.Cash_Flow?.freeCashflow)}</td>
                        <td class="score-cell ${fcfYoY.class}">${fcfYoY.value}</td>
                        <td class="score-cell">${ratios.debtEquityRatio ? parseFloat(ratios.debtEquityRatio).toFixed(2) : 'N/A'}</td>
                        <td class="score-cell">${ratios.returnOnEquity ? (parseFloat(ratios.returnOnEquity.replace('%', ''))).toFixed(1) + '%' : 'N/A'}</td>
                    </tr>
                `;
            });
        
            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;
            
            tableContainer.innerHTML = tableHtml;
            
            const columnKeys = ['ticker', 'companyName', 'lastUpdate', 'overallTier', 'overallTier', 'qualityScore', 'idqScore', 'antiFragileScore', 'marketCap', 'peRatio', 'revenue', 'revenueYoY', 'netIncome', 'netIncomeYoY', 'fcf', 'fcfYoY', 'debtEquityRatio', 'roe'];
            const sortedColumnIndex = columnKeys.indexOf(sortConfig.key);

            if (sortedColumnIndex > -1) {
                const table = tableContainer.querySelector('.data-table');
                const rows = table.querySelectorAll('tr');
                rows.forEach(row => {
                    const cell = row.children[sortedColumnIndex];
                    if (cell) {
                        cell.classList.add('sorted-column');
                    }
                });
            }
            
            tableContainer.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', function() {
                    const sortKey = this.dataset.sort;
                    handleTableSort(sortKey);
                });
            });
            
            tableWrapper.appendChild(tableContainer);
            return tableWrapper;
        }
        
        function handleTableSort(key) {
            const tableContainer = document.querySelector('.data-table-container');
            if (tableContainer) {
                lastScrollLeft = tableContainer.scrollLeft;
            }

            if (sortConfig.key === key) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = key;
                sortConfig.direction = (key === 'ticker' || key === 'companyName') ? 'asc' : 'desc';
            }

            // --- FIX: Expanded map to include all sortable columns ---
            const keyToTypeMap = {
                ticker: 'string',
                companyName: 'string',
                lastUpdate: 'date',
                overallTier: 'number',
                qualityScore: 'number',
                idqScore: 'number',
                antiFragileScore: 'number',
                marketCap: 'number',
                peRatio: 'number',
                revenue: 'number',
                revenueYoY: 'number',
                netIncome: 'number',
                netIncomeYoY: 'number',
                fcf: 'number',
                fcfYoY: 'number',
                debtEquityRatio: 'number',
                roe: 'number'
            };
            sortConfig.type = keyToTypeMap[key];

            render();

            setTimeout(() => {
                const newTableContainer = document.querySelector('.data-table-container');
                if (newTableContainer) {
                    newTableContainer.scrollLeft = lastScrollLeft;
                }
            }, 0);
        }
        
        let compareList = [];

        function addToCompare(ticker) {
            if (compareList.length < 4 && !compareList.includes(ticker)) {
                compareList.push(ticker);
                updateCompareBar();
            }
        }
        
        function showComparison() {
            const stocks = compareList.map(ticker => 
                allStocks.find(s => s.Portfolio.ticker === ticker)
            );
        }
        
        function setView(viewName) {
            currentView = viewName;
            currentPage = 1;
            displayedItems = 25;
            const url = new URL(window.location);
            url.searchParams.set('view', viewName);
            history.pushState({}, '', url);
        
            gridBtn.classList.remove('active');
            listBtn.classList.remove('active');
            document.getElementById('table-view-btn')?.classList.remove('active');
            
            if (viewName === 'list') {
                listBtn.classList.add('active');
                listHeader.classList.remove('md:hidden');
                listHeader.classList.add('md:grid');
            } else {
                listHeader.classList.add('md:hidden');
                listHeader.classList.remove('md:grid');
                
                if (viewName === 'grid') {
                    gridBtn.classList.add('active');
                } else if (viewName === 'table') {
                    document.getElementById('table-view-btn')?.classList.add('active');
                }
            }
            
            render();
        }

        searchBar.addEventListener('input', render);
        gridBtn.addEventListener('click', () => setView('grid'));
        listBtn.addEventListener('click', () => setView('list'));
        document.getElementById('table-view-btn')?.addEventListener('click', () => setView('table'));

        // --- FIX: Corrected the logic for the List View header sorting ---
        listHeader.addEventListener('click', (e) => {
            const header = e.target.closest('.sort-header');
            if (!header) return;
            const newSortKey = header.dataset.sort;
            if (sortConfig.key === newSortKey) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.key = newSortKey;
                sortConfig.direction = (newSortKey === 'companyName') ? 'asc' : 'desc';
            }
            sortConfig.type = (newSortKey === 'companyName') ? 'string' : (newSortKey === 'lastUpdate') ? 'date' : 'number';
            
            listHeader.querySelectorAll('.sort-header').forEach(h => h.classList.remove('active'));
            header.classList.add('active');
            listHeader.querySelectorAll('.sort-arrow').forEach(a => a.textContent = '');
            header.querySelector('.sort-arrow').textContent = sortConfig.direction === 'desc' ? '↓' : '↑';
            render();
        });
        
        function setupTooltips() {
            const tooltip = document.getElementById('tooltip');
            let tooltipTimeout;
            document.body.addEventListener('mouseover', (e) => {
                const trigger = e.target.closest('[data-tooltip]');
                if (trigger && trigger.dataset.tooltip) {
                    clearTimeout(tooltipTimeout);
                    tooltip.innerHTML = trigger.dataset.tooltip;
                    tooltip.classList.add('show');
                    const rect = trigger.getBoundingClientRect();
                    tooltip.style.left = `${rect.left + window.scrollX}px`;
                    tooltip.style.top = `${rect.bottom + window.scrollY + 8}px`;
                }
            });
            document.body.addEventListener('mouseout', (e) => {
                const trigger = e.target.closest('[data-tooltip]');
                if (trigger) {
                    tooltipTimeout = setTimeout(() => tooltip.classList.remove('show'), 200);
                }
            });
        }
        
        contentContainer.addEventListener('mouseenter', (e) => {
            const card = e.target.closest('.preview-card');
            if (card) {
                clearTimeout(hoverTimeout);
                const ticker = card.dataset.ticker;
                if (ticker) fetchAndDrawCardChart(ticker);
            }
        }, true);

        async function fetchAndDrawCardChart(ticker) {
            const canvas = document.getElementById(`chart-${ticker}`);
            if (!canvas) return;

            if (chartCache[ticker]) {
                drawCardChart(canvas, chartCache[ticker]);
                return;
            }
            
            const functionUrl = 'https://getchartdata-py46mxz5aq-uc.a.run.app';

            try {
                const response = await fetch(`${functionUrl}?ticker=${ticker}&timeframe=1M`);
                if (!response.ok) {
                    throw new Error(`Function returned status ${response.status}`);
                }
                const result = await response.json();

                if (result && result.data && result.data.length > 0) {
                    chartCache[ticker] = result.data;
                    drawCardChart(canvas, result.data);
                }
            } catch (error) {
                console.error(`Error fetching chart for ${ticker}:`, error);
            }
        }

        function drawCardChart(canvas, data) {
            if (!canvas) return;
            canvas.dataset.rendered = 'true';
            const ctx = canvas.getContext('2d');
            
            const isLightTheme = document.body.classList.contains('light-theme');
            
            const prices = [...data].reverse().map(d => d.close);
            const isUp = prices[prices.length - 1] >= prices[0];
            
            const upColor = isLightTheme ? 'rgba(22, 163, 74, 0.7)' : 'rgba(34, 197, 94, 0.8)';
            const downColor = isLightTheme ? 'rgba(220, 53, 69, 0.7)' : 'rgba(239, 68, 68, 0.8)';
            const upGradient = isLightTheme ? 'rgba(22, 163, 74, 0.2)' : 'rgba(34, 197, 94, 0.3)';
            const downGradient = isLightTheme ? 'rgba(220, 53, 69, 0.2)' : 'rgba(239, 68, 68, 0.3)';
            const gradientEndColor = isLightTheme ? 'rgba(255, 255, 255, 0)' : 'rgba(13, 17, 23, 0)';
        
            const maxPrice = Math.max(...prices);
            const minPrice = Math.min(...prices);
            const range = maxPrice - minPrice === 0 ? 1 : maxPrice - minPrice;
            const width = canvas.width = canvas.parentElement.offsetWidth;
            const height = canvas.height = canvas.parentElement.offsetHeight;
            
            ctx.clearRect(0, 0, width, height);
            ctx.beginPath();
            ctx.moveTo(0, height - ((prices[0] - minPrice) / range) * height);
            prices.forEach((price, index) => {
                const x = (index / (prices.length - 1)) * width;
                const y = height - ((price - minPrice) / range) * height;
                ctx.lineTo(x, y);
            });
            
            ctx.strokeStyle = isUp ? upColor : downColor;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, isUp ? upGradient : downGradient);
            gradient.addColorStop(1, gradientEndColor);
            ctx.fillStyle = gradient;
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();
        }
        
      
        const sidebar = document.querySelector('.sidebar');
        const mainContent = document.getElementById('main-content');
        const toggleButton = document.getElementById('sidebar-toggle');
        const homeButton = document.getElementById('home-btn');

        function setSidebarState(isCollapsed) {
            if (isCollapsed) {
                sidebar.classList.add('sidebar-collapsed');
                mainContent.classList.remove('ml-56');
                mainContent.classList.add('ml-20');
                toggleButton.style.left = '3.5rem';
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                mainContent.classList.remove('ml-20');
                mainContent.classList.add('ml-56');
                toggleButton.style.left = '12.5rem';
            }
        }
        toggleButton.addEventListener('click', () => setSidebarState(!sidebar.classList.contains('sidebar-collapsed')));
        
        homeButton.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        document.addEventListener('DOMContentLoaded', () => {
            setSidebarState(window.innerWidth < 1024);
            setupTooltips();
            displayRecentCompanies();
            loadSearchableStocks().then(setupSearchBar);
            loadFilterPreferences();
            
            document.getElementById('apply-filters')?.addEventListener('click', applyFilters);
            document.getElementById('reset-filters')?.addEventListener('click', resetFilters);
            document.getElementById('mobile-apply-filters')?.addEventListener('click', applyMobileFilters);
            document.getElementById('mobile-reset-filters')?.addEventListener('click', resetMobileFilters);
            document.getElementById('filter-sector')?.addEventListener('change', populateIndustries);
            loadFilterPreferences();
        
            const mobileMenuBtn = document.querySelector('.mobile-menu-toggle');
            const mobileMask = document.querySelector('.mobile-overlay-mask');
        
            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            }
            if (mobileMask) {
                mobileMask.addEventListener('click', toggleMobileMenu); 
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const viewFromUrl = urlParams.get('view');
            setView(['grid', 'list', 'table'].includes(viewFromUrl) ? viewFromUrl : 'list');
            
            db.collection("stocks").get().then((querySnapshot) => {
                document.getElementById('loading-message')?.remove();
                querySnapshot.forEach((doc) => allStocks.push(doc.data()));
                render();
            }).catch(error => {
                console.error("Error fetching portfolio: ", error);
                contentContainer.innerHTML = '<p class="text-red-500 text-center p-8">Error fetching data. Please try again later.</p>';
            });
        
            const themeObserver = new MutationObserver(() => render());
            themeObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        });
        
        document.getElementById('items-per-page')?.addEventListener('change', (e) => {
            itemsPerPage = parseInt(e.target.value);
            currentPage = 1;
            render();
        });
        
        document.getElementById('prev-page')?.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        
        document.getElementById('next-page')?.addEventListener('click', () => {
            const totalPages = Math.ceil(allStocks.filter(s => s.Portfolio).length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        
        document.getElementById('show-more-btn')?.addEventListener('click', () => {
            displayedItems += 25;
            render();
        });
               
        function displayRecentCompanies() {
            const container = document.getElementById('recent-companies');
            if (!container) return;
            const recent = JSON.parse(localStorage.getItem('recentCompanies') || '[]');
            if (recent.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-600 px-2">No recent visits</p>';
                return;
            }
        
            const sidebar = document.querySelector('.sidebar');
            const isCollapsed = sidebar?.classList.contains('sidebar-collapsed');
        
            container.innerHTML = recent.map(company => {
                const logoUrl = company.website ? getLogoUrl(company.website) : '';
            
                return `
                    <a href="company-card.html?ticker=${company.ticker}" 
                       class="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-[#161B22] transition-colors text-sm"
                       title="${company.name}">
                        <div class="flex-shrink-0 w-5 h-5">
                            ${logoUrl ? 
                                `<img src="${logoUrl}" alt="${company.ticker}" class="w-5 h-5 rounded bg-white p-0.5 object-contain" 
                                      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                 <div class="w-5 h-5 rounded bg-gray-700 text-[10px] hidden items-center justify-center font-bold">${company.ticker[0]}</div>` :
                                `<div class="w-5 h-5 rounded bg-gray-700 text-[10px] flex items-center justify-center font-bold">${company.ticker[0]}</div>`
                            }
                        </div>
                        <span class="company-text truncate">${company.ticker}</span>
                    </a>
                `;
            }).join('');
        }
        
        let searchableStocks = [];
        async function loadSearchableStocks() {
            try {
                const querySnapshot = await db.collection("stocks").get();
                searchableStocks = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.Portfolio?.ticker && data.Portfolio?.companyName) {
                        searchableStocks.push({
                            ticker: data.Portfolio.ticker,
                            name: data.Portfolio.companyName
                        });
                    }
                });
            } catch (error) {
                console.error("Error loading searchable stocks:", error);
            }
        }
        
        function setupSearchBar() {
            const searchInput = document.getElementById('sidebar-search');
            const searchResults = document.getElementById('search-results');
            if (!searchInput || !searchResults) return;
            let searchTimeout;
            
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.toLowerCase().trim();
                if (query.length < 1) {
                    searchResults.classList.add('hidden');
                    return;
                }
                const matches = searchableStocks.filter(stock => 
                    stock.ticker.toLowerCase().startsWith(query) || 
                    stock.name.toLowerCase().includes(query)
                ).slice(0, 5);
                
                searchResults.innerHTML = matches.map(stock => `
                    <div class="search-result-item" data-ticker="${stock.ticker}">
                        <div class="font-semibold">${stock.ticker}</div>
                        <div class="text-xs text-body">${stock.name}</div>
                    </div>
                `).join('');
                searchResults.classList.remove('hidden');
            });
        
            searchResults.addEventListener('click', (e) => {
                const item = e.target.closest('.search-result-item');
                if (item) {
                    window.location.href = `company-card.html?ticker=${item.dataset.ticker}`;
                }
            });
        
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.sidebar-search-container')) {
                    searchResults.classList.add('hidden');
                }
            });
        }
        
        function toggleMobileMenu() {
            document.querySelector('.sidebar').classList.toggle('sidebar-expanded');
            document.querySelector('.mobile-overlay-mask').classList.toggle('active');
        }
    </script>
